<body>
<title>토익 900 데일리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: OMR answer-sheet motif — single column, sticky tab strip, bubbles as the core control */
:root{
  --paper:#f6f7f9; --card:#ffffff; --ink:#1b2333; --muted:#5b6578; --line:#dde1e8;
  --omr:#cf2f62; --omr-soft:#fbe4ec; --good:#1d8456; --good-soft:#e2f4ea; --warn:#a86a12;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11141b; --card:#191d26; --ink:#e6e9ef; --muted:#9ba4b4; --line:#2b313d;
  --omr:#f2709a; --omr-soft:#3b1b29; --good:#4cc38a; --good-soft:#163428; --warn:#e0a84a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141b; --card:#191d26; --ink:#e6e9ef; --muted:#9ba4b4; --line:#2b313d;
  --omr:#f2709a; --omr-soft:#3b1b29; --good:#4cc38a; --good-soft:#163428; --warn:#e0a84a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
header .inner{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--display);font-weight:400;font-size:22px;margin:0;letter-spacing:.5px}
.brand h1 span{color:var(--omr)}
.brand small{color:var(--muted);font-family:var(--mono);font-size:12px}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:6px}
nav button{flex:1 0 auto;border:0;background:none;color:var(--muted);font:500 14px var(--body);padding:8px 10px 10px;border-bottom:3px solid transparent;cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--omr)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
section.view{display:grid;gap:16px;padding-top:18px}
h2{font-size:17px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;min-width:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* D-day */
.dday{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.dday .num{font-family:var(--display);font-size:52px;line-height:1;color:var(--omr)}
.dday .meta{display:grid;gap:4px;min-width:0}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--omr)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.btn{font:600 14px var(--body);border:1px solid var(--ink);background:var(--ink);color:var(--card);border-radius:6px;padding:8px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{padding:4px 10px;font-size:13px}
/* tasks */
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.task{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-top:1px dashed var(--line);align-items:start}
.task:first-child{border-top:0}
.task .t{min-width:0}
.task .t b{display:block;font-weight:600}
.task .t span{color:var(--muted);font-size:13.5px}
.task.done .t b{text-decoration:line-through;color:var(--muted)}
/* bubble */
.bub{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--omr);background:transparent;color:var(--omr);font:600 12px var(--mono);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.bub[aria-pressed="true"]{background:var(--omr);color:var(--card)}
.phase-pill{display:inline-block;font-size:12px;font-weight:700;color:var(--omr);background:var(--omr-soft);border-radius:99px;padding:2px 10px}
/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700}
td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
/* roadmap phases */
.phases{display:grid;gap:10px}
.ph{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.ph .w{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.ph.now .w{color:var(--omr);font-weight:600}
.ph ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
/* quiz */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:500 14px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--omr);color:var(--omr);background:var(--omr-soft)}
.q-stem{font-size:16px;line-height:1.65}
.blank{display:inline-block;min-width:76px;padding:0 6px;margin:0 3px;border-bottom:2px solid var(--omr);background:var(--omr-soft);border-radius:4px 4px 0 0;color:var(--omr);font:600 12px/1.7 var(--mono);text-align:center;vertical-align:baseline;cursor:pointer}
.blank.on{font:600 15px/1.5 var(--body)}
.blank.ok{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.blank.ng{text-decoration:line-through}
.mq.flash-q{outline:2px solid var(--omr);outline-offset:4px;border-radius:6px}
.mstem{font-size:16px;line-height:1.9}
.choices{display:grid;gap:6px}
.choice{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.choice .bub{pointer-events:none}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.right .bub{background:var(--good);border-color:var(--good);color:var(--card)}
.choice.wrong{border-color:var(--omr);background:var(--omr-soft)}
.choice.wrong .bub{background:var(--omr);color:var(--card)}
.explain{border-left:3px solid var(--good);padding:6px 12px;background:var(--paper);border-radius:0 6px 6px 0;font-size:14px}
.explain.bad{border-color:var(--omr)}
.tag{font-size:12px;color:var(--muted);font-family:var(--mono)}
.passage{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:14px;white-space:pre-line}
/* words */
.flash{min-height:150px;display:grid;place-items:center;text-align:center;border:1.5px dashed var(--line);border-radius:10px;padding:20px;cursor:pointer;background:var(--card);color:var(--ink);font:inherit;width:100%}
.flash .en{font-size:28px;font-weight:700}
.flash .ko{font-size:18px;color:var(--omr);margin-top:6px}
.wordlist{columns:2;column-gap:20px;font-size:14px}
.wordlist div{break-inside:avoid;padding:3px 0;border-bottom:1px dotted var(--line)}
@media (max-width:420px){.wordlist{columns:1}.dday .num{font-size:44px}}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:12px}
.note{font-size:13px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted)}
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mbar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.clock{font:600 22px var(--mono);font-variant-numeric:tabular-nums}
.clock.over{color:var(--omr)}
.mpart{display:grid;gap:12px}
.mpart>.hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-top:6px;border-top:2px solid var(--ink)}
.mq{display:grid;gap:8px;padding-top:10px;border-top:1px dashed var(--line)}
.mq:first-child{border-top:0;padding-top:0}
.qn{font-family:var(--mono);font-weight:600;color:var(--omr)}
.res{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.res .big{font-family:var(--display);font-size:46px;line-height:1;color:var(--omr)}
.testing{padding-bottom:90px}
.btn:disabled{opacity:.4;cursor:default}
.sscard{border:1.5px solid var(--omr)}
.sscard .big{font-family:var(--display);font-size:24px;line-height:1.2}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.stp{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.stp.d{color:var(--good);border-color:var(--good)}
.stp.c{color:var(--card);background:var(--omr);border-color:var(--omr)}
.lesson{display:grid;gap:0}
.lesson .lr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.lesson .lr:first-child{border-top:0}
.lesson .ex{font-family:var(--mono);font-size:13px;color:var(--omr)}
@media (max-width:480px){.lesson .lr{grid-template-columns:1fr;gap:2px}}
.sbar{display:flex;gap:4px}
.sbar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.sbar i.d{background:var(--good)}
.sbar i.c{background:var(--omr)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
[hidden]{display:none!important}
.btn:disabled{opacity:.4;cursor:default}
.sscard{border:1.5px solid var(--omr)}
.sscard .big{font-family:var(--display);font-size:26px;line-height:1.2}
.blank{display:inline-block;min-width:76px;padding:0 6px;margin:0 3px;border-bottom:2px solid var(--omr);background:var(--omr-soft);border-radius:4px 4px 0 0;color:var(--omr);font:600 12px/1.7 var(--mono);text-align:center}
.blank.on{font:600 15px/1.5 var(--body)}
.blank.ok{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.blank.ng{text-decoration:line-through}
.lv{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.lv.lv1{color:var(--omr);border-color:var(--omr);background:var(--omr-soft)}
.lv.lv2{color:var(--warn);border-color:var(--warn)}
.lv.lv3{color:var(--good);border-color:var(--good)}
.lv.lv4{color:var(--card);background:var(--good);border-color:var(--good)}
.bt i.lv0{background:var(--line)}.bt i.lv1{background:var(--omr)}.bt i.lv2{background:var(--warn)}.bt i.lv3,.bt i.lv4{background:var(--good)}
.ulist{display:grid;gap:2px}
.urow,.brow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 4px;border:0;border-top:1px dashed var(--line);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;width:100%}
.urow:first-child,.brow:first-child{border-top:0}
.urow:hover,.brow:hover{background:var(--paper)}
.bars{display:grid;gap:0}
.brow{grid-template-columns:minmax(90px,38%) minmax(0,1fr) 44px}
.bn{font-size:13.5px;min-width:0}
.bt{height:10px;border-radius:5px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.bt i{display:block;height:100%}
.bv{text-align:right;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tiles div{display:grid;gap:2px;padding:10px;background:var(--paper);border-radius:8px}
.tiles b{font-size:22px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.alog{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.trap{margin:4px 0 0;padding-left:18px;font-size:14px}
.sbar{display:flex;gap:3px}
.sbar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.sbar i.d{background:var(--good)}.sbar i.x{background:var(--omr)}.sbar i.c{background:var(--ink)}
.qn{font-family:var(--mono);font-weight:600;color:var(--omr)}
.tagc{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.clock{font-size:14px;color:var(--muted)}
.clock.over{color:var(--omr);font-weight:600}
.slotq{display:grid;gap:8px;padding:12px;border:1.5px dashed var(--omr);border-radius:8px}
.slots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:480px){.slots{grid-template-columns:repeat(3,minmax(0,1fr))}}
.slotb{display:grid;gap:0;justify-items:center;padding:8px 2px;border:1.5px solid var(--omr);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.slotb b{font:600 18px var(--mono);color:var(--omr)}
.slotb span{font-size:12px;color:var(--muted)}
.slotb:hover{background:var(--omr-soft)}
.errq{display:grid;gap:6px}
.errq .seg button{font-size:13px;padding:5px 12px}
.lesson{display:grid;gap:0}
.lesson .lr{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px dashed var(--line)}
.lesson .lr:first-child{border-top:0}
.lesson .lr .note{font-size:13px}
.lesson .ex{font-family:var(--mono);font-size:12.5px;color:var(--omr);overflow-wrap:anywhere}
@media (max-width:480px){.lesson .lr{grid-template-columns:1fr;gap:2px}}
.nsec{display:grid;gap:4px}
.nsec h3{font-size:14px;color:var(--muted);letter-spacing:.02em;margin-top:6px}
.fix{display:grid;gap:4px;padding:10px;border:1px solid var(--warn);border-radius:8px;font-size:14px}
.fixtag{display:inline-block;font-size:11px;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:0 5px;margin-right:4px}
.fixtag.ok{color:var(--good);border-color:var(--good)}
.svcom{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.svcom div{display:grid;justify-items:center;padding:10px 2px;border:1.5px solid var(--ink);border-radius:8px}
.svcom b{font:600 24px var(--mono);color:var(--omr)}
.svcom span{font-size:12px;color:var(--muted)}
.steps2{margin:0;padding-left:20px;display:grid;gap:8px}
.steps2 li{display:grid;gap:2px}
.steps2 span{font-size:14px;color:var(--muted)}
.setrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
textarea{font:13px var(--mono);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%;min-width:0;resize:vertical}
.res{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.res .big{font-family:var(--display);font-size:46px;line-height:1;color:var(--omr)}
/* ---------- mobile ---------- */
:root{--navh:58px}
nav button svg{display:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button,a,select,input,textarea{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.choice,.slotb,.urow,.brow,.flash{-webkit-user-select:none;user-select:none}
.actbar .in{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -4px 16px rgba(0,0,0,.06)}

}

@media (max-width:400px){.dday{grid-template-columns:1fr;gap:8px}.dday .num{font-size:40px}}
</style>

function qProblem(q,kind){
 if(!q||typeof q.id!=="string")return "id 없음";
 if(BYID[q.id])return "id 중복";
 const nc=kind==="lc"?3:4;
 if(!Array.isArray(q.c)||q.c.length!==nc||q.c.some(x=>typeof x!=="string"||!x))return "보기 "+nc+"개가 아님";
 if(!Number.isInteger(q.a)||q.a<0||q.a>=nc)return "정답 번호 오류";
 if(typeof q.e!=="string"||!q.e)return "해설 없음";
 if(kind==="g"){if(!UID[q.u])return "단원 없음("+q.u+")";if(typeof q.s!=="string"||!q.s.includes("____"))return "빈칸(____) 없음";if(q.r&&!SLOTN[q.r])return "자리 태그 오류"}
 else if(typeof q.q!=="string"||!q.q)return "질문 없음";
 return null;
}

 if(!/^\d{4}-\d{2}-\d{2}$/.test(o.exam))o.exam="2026-12-27";

 });

 if(S.log.length!==before){fixed+=before-S.log.length;issues.push("손상된 풀이 기록 "+(before-S.log.length)+"건 정리")}
 if(S.log.length>400){S.log=S.log.slice(-400)}

 if(S.cur){const ok=Array.isArray(S.cur.items)&&S.cur.items.every(it=>it&&BYID[it.id]);

 Object.keys(S.days).forEach(d=>{const x=S.days[d];if(!x||typeof x!=="object"||!/^\d{4}-\d{2}-\d{2}$/.test(d)){delete S.days[d];fixed++}});

 m.log=[...L.values()].sort((x,y)=>x.t-y.t).slice(-400);
 Object.entries(O.qs).forEach(([id,v])=>{const w=m.qs[id];if(!w||(v.n||0)>(w.n||0))m.qs[id]=v});
 Object.entries(O.days).forEach(([d,v])=>{const w=m.days[d];if(!w||(v.n||0)>(w.n||0)||((v.n||0)===(w.n||0)&&(v.ss||0)>(w.ss||0)))m.days[d]=v});

 m.unk=[...new Set(O.unk.concat(m.unk))];
 const uni=(x,y,f)=>{const M=new Map();x.concat(y).forEach(e=>M.set(f(e),e));return [...M.values()]};
 m.adapt=uni(O.adapt,m.adapt,e=>e.d+"|"+e.m).sort((x,y)=>String(x.d).localeCompare(String(y.d))).slice(-60);

function unitStat(u){
 const all=S.log.filter(x=>x.u===u&&!x.rt);const last=all.slice(-20).reverse();

  ms:ok.length?Math.round(ok.reduce((a,x)=>a+x.ms,0)/ok.length):null,seen:pool.filter(q=>S.qs[q.id]).length,total:pool.length};
}

 const next=UNITS.find(u=>st[u.id].n<3);
 let focus,why;
 if(weak.length){focus=weak[0].id;why="정답률 "+st[focus].m+"% — 약점 단원 집중"}
 else if(next){focus=next.id;why=started.length?"앞 단원 통과(60% 이상) → 노트 순서대로 다음 단원":"노트 순서대로 첫 단원부터"}
 else{const lo=started.slice().sort((a,b)=>st[a.id].m-st[b.id].m)[0];focus=lo.id;why="전 단원 학습 완료 · 가장 낮은 단원("+st[focus].m+"%) 보강"}
 const rg=recentG(30),okT=rg.filter(x=>x.ok),avg=okT.length?okT.reduce((a,x)=>a+x.ms,0)/okT.length:0;
 const prevSpeed=S.plan&&S.plan.speed;
 let speed=S.settings.speed==="on"?25:S.settings.speed==="off"?0:(rg.length>=15&&avg>22000?25:(prevSpeed&&avg>18000?25:0));
 const sa=slotAcc(30);
 const slot=S.settings.slot==="on"?true:S.settings.slot==="off"?false:!(sa.n>=30&&sa.acc>=90);
 const em=errMix();
 const lessonFirst=st[focus].n<3||(em.n>=5&&em.c.concept/em.n>=0.4);

  if(!o.slot&&p.slot&&S.settings.slot==="auto")msgs.push("자리 판별 단계 다시 켬");
  if(o.words!==p.words)msgs.push(p.words>o.words?"단어 몰라서 틀린 비율이 높음 → 세션 단어 10개로 늘림":"단어 오답 감소 → 세션 단어 5개로 복귀");
  if(p.lessonFirst&&!o.lessonFirst&&p.em.n>=5&&p.em.c.concept/p.em.n>=0.4)msgs.push("'개념 몰라서' 오답이 많음 → 문제 전에 노트부터 보도록 변경");
 }
 UNITS.forEach(u=>{const s=p.st[u.id],q=o&&o.st?o.st[u.id]:null;if(s.m>=90&&s.n>=10&&!(q&&q.m>=90&&q.n>=10))msgs.push(u.n+" 강점 단계 도달 → 출제 비중 축소")});
 msgs.forEach(adaptLog);

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rankPool(pool){
 const un=shuffle(pool.filter(q=>!S.qs[q.id]));
 const seen=pool.filter(q=>S.qs[q.id]).sort((a,b)=>{const x=S.qs[a.id],y=S.qs[b.id];return (x.c/x.n)-(y.c/y.n)||String(x.last).localeCompare(String(y.last))});
 return un.concat(seen);
}
function buildSession(opt){
 opt=opt||{};const p=makePlan(),N=+S.settings.size,used=new Set(),items=[];
 const take=(q,tag)=>{if(q&&!used.has(q.id)){used.add(q.id);items.push({id:q.id,tag})}};
 const due=BANK.filter(q=>S.qs[q.id]&&S.qs[q.id].due<=TODAY).sort((a,b)=>S.qs[a.id].box-S.qs[b.id].box||S.qs[a.id].due.localeCompare(S.qs[b.id].due));
 if(opt.unit){
  due.filter(q=>q.u===opt.unit).slice(0,4).forEach(q=>take(q,"복습"));
  rankPool(BANK.filter(q=>q.u===opt.unit&&!used.has(q.id))).slice(0,10-items.length).forEach(q=>take(q,"단원"));
 }else{
  const hasRC=N>=15,G=N-2-(hasRC?2:0);
  due.slice(0,Math.floor(G*0.35)).forEach(q=>take(q,"복습"));
  rankPool(BANK.filter(q=>q.u===p.focus&&!used.has(q.id))).slice(0,Math.round(G*0.45)).forEach(q=>take(q,"집중"));
  const cand=UNITS.filter(u=>u.ix<=p.frontier+1&&u.id!==p.focus);let guard=0;
  while(items.length<G&&guard++<200){
   let pick=null;
   if(cand.length){const ws=cand.map(u=>{const m=p.st[u.id].m;return m==null?40:(100-m)+10});let r=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<cand.length;i++){r-=ws[i];if(r<=0){pick=cand[i];break}}pick=pick||cand[0]}
   const pool=rankPool(BANK.filter(q=>(!pick||q.u===pick.id)&&!used.has(q.id)));
   if(pool.length)take(pool[0],"혼합");else{const any=rankPool(BANK.filter(q=>!used.has(q.id)));if(!any.length)break;take(any[0],"혼합")}
  }
  const head=items.filter(x=>x.tag==="복습"),body=shuffle(items.filter(x=>x.tag!=="복습"));items.length=0;items.push(...head,...body);
  rankPool(LCB.filter(q=>!used.has(q.id))).slice(0,2).forEach(q=>take(q,"듣기"));
  if(hasRC){const px=rankPool(RCB)[0];if(px)RCB.filter(q=>q.px===px.px).slice(0,2).forEach(q=>take(q,"독해"))}
 }
 const wds=[];const dueW=WORDS.filter(w=>S.wd[w[0]]&&!S.wd[w[0]].k&&S.wd[w[0]].due<=TODAY);
 dueW.slice(0,p.words).forEach(w=>wds.push(w[0]));
 let wp=S.wpos||0,g=0;while(wds.length<p.words&&g++<WORDS.length){const w=WORDS[wp%WORDS.length][0];wp++;if(!S.wd[w]&&!wds.includes(w))wds.push(w)}
 return {d:TODAY,kind:opt.unit?"unit":"daily",unit:opt.unit||p.focus,why:opt.unit?"직접 고른 단원":p.why,items,i:0,stage:(opt.unit||p.lessonFirst)?"lesson":"q",ans:{},sl:{},err:{},ms:{},retried:{},words:opt.unit?[]:wds,wi:0,wk:0,flip:false,t0:Date.now(),speed:p.speed,slot:p.slot,wpos:wp};
}

function record(q,ok,ms,rt,sl){
 const d=S.days[TODAY]=S.days[TODAY]||{n:0,c:0,ms:0,ss:0,sec:0};
 S.log.push({t:Date.now(),d:TODAY,id:q.id,u:q.kind==="g"?q.u:q.kind,ok:ok?1:0,ms,rt:rt?1:0,sl});
 if(S.log.length>400)S.log=S.log.slice(-400);
 if(rt)return;
 d.n++;if(ok)d.c++;d.ms+=ms;
 const v=S.qs[q.id]||{n:0,c:0,box:0,due:TODAY,last:TODAY};v.n++;if(ok)v.c++;v.last=TODAY;
 const IV=[0,1,2,4,7,15];
 if(ok){v.box=Math.min(5,(v.box||0)+1);v.due=addDays(TODAY,IV[v.box])}else{v.box=1;v.due=addDays(TODAY,1)}
 S.qs[q.id]=v;
}

function trendSVG(){
 const W=640,H=200,pl=34,pr=34,pt=12,pb=26,days=[];for(let i=13;i>=0;i--)days.push(addDays(TODAY,-i));
 const mx=Math.max(10,...days.map(d=>S.days[d]?S.days[d].n:0)),bw=(W-pl-pr)/14;
 const X=i=>pl+bw*i+bw/2,Yn=v=>pt+(H-pt-pb)*(1-v/mx),Ya=v=>pt+(H-pt-pb)*(1-v/100);
 let g="";[0,50,100].forEach(v=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${Ya(v)}" y2="${Ya(v)}" stroke="var(--line)"/><text x="${W-pr+4}" y="${Ya(v)+4}" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}%</text>`});
 g+=`<text x="${pl-4}" y="${pt+8}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${mx}</text>`;
 const pts=[];days.forEach((d,i)=>{const x=S.days[d];if(x&&x.n){g+=`<rect x="${X(i)-bw*0.3}" y="${Yn(x.n)}" width="${bw*0.6}" height="${H-pb-Yn(x.n)}" fill="var(--omr-soft)" stroke="var(--omr)" stroke-width="1"/>`;pts.push([X(i),Ya(x.c/x.n*100)])}
  if(i%2===0||i===13)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${d.slice(5).replace("-","/")}</text>`});
 if(pts.length>1)g+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
 pts.forEach((p,i)=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:3}" fill="var(--ink)"/>`);
 if(!pts.length)g+=`<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="13" fill="var(--muted)">세션을 풀면 날짜별 기록이 그려집니다</text>`;
 return `<p class="note" style="margin:0">막대 = 푼 문제 수 · 선 = 정답률</p><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 14일 학습량과 정답률">${g}</svg>`;
}

 if(id==="mStart"||id==="mAgain"){M={phase:"test",ans:{},t0:Date.now(),tRC:0,timer:setInterval(tick,1000),result:null};renderMock();window.scrollTo(0,0)}
 if(id==="mHome"){M.phase="intro";renderMock();window.scrollTo(0,0)}
 if(id==="mRC"){M.tRC=Date.now();const y=window.scrollY;renderMock();window.scrollTo(0,y)}
 if(id==="mSubmit"){
  const left=28-Object.keys(M.ans).length;
  if(left>0&&e.target.dataset.sure!=="1"){e.target.dataset.sure="1";e.target.textContent=left+"문항 미응답 · 그래도 제출";return}
  clearInterval(M.timer);try{speechSynthesis.cancel()}catch(x){}
  let lc=0,rc=0;MLIST.forEach((x,i)=>{if(M.ans[i]===x.it.a){x.sec==="LC"?lc++:rc++}});
  const t=M.tRC?(Date.now()-M.tRC)/1000:0;
  M.result={lc,rc,t};M.phase="result";S.mocks.push({d:TODAY,lc,rc,t:Math.round(t)});save();renderMock();window.scrollTo(0,0)}
});

/* ---------- log ---------- */
$("#sDate").value=TODAY;
$("#scoreForm").addEventListener("submit",e=>{e.preventDefault();const lc=+$("#sLC").value,rc=+$("#sRC").value;if(!lc||!rc)return;S.scores.push({d:$("#sDate").value,lc,rc});S.scores.sort((a,b)=>a.d<b.d?-1:1);save();$("#sLC").value="";$("#sRC").value="";renderLog()});
$("#scoreTbl").addEventListener("click",e=>{const b=e.target.closest("[data-del]");if(b){S.scores.splice(+b.dataset.del,1);save();renderLog()}});
function renderLog(){
 const sc=S.scores,W=640,H=240,pl=40,pr=12,pt=14,pb=28,y0=500,y1=990;
 const Y=v=>pt+(H-pt-pb)*(1-(Math.min(Math.max(v,y0),y1)-y0)/(y1-y0));
 const n=sc.length,X=i=>pl+(n<=1?(W-pl-pr)/2:(W-pl-pr)*i/(n-1));
 let g="";
 [500,600,700,800,900,990].forEach(v=>{const tgt=v===800||v===900;g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(${tgt?"--omr":"--line"})" stroke-dasharray="${tgt?"5 4":"0"}" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`});
 if(n){const pts=sc.map((s,i)=>`${X(i)},${Y(s.lc+s.rc)}`).join(" ");
  g+=`<polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
  sc.forEach((s,i)=>{const last=i===n-1;g+=`<circle cx="${X(i)}" cy="${Y(s.lc+s.rc)}" r="${last?5:3.5}" fill="${last?"var(--omr)":"var(--ink)"}"/>`;if(last||n<=6)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${s.d.slice(5).replace("-","/")}</text>`});
  const l=sc[n-1];g+=`<text x="${Math.min(X(n-1),W-pr-4)}" y="${Y(l.lc+l.rc)-10}" text-anchor="${n>1?"end":"middle"}" font-size="13" font-weight="700" fill="var(--omr)" font-family="IBM Plex Mono,monospace">${l.lc+l.rc}</text>`;
 }else g+=`<text x="${(W+pl)/2}" y="${H/2+30}" text-anchor="middle" font-size="13" fill="var(--muted)">첫 모의고사 점수를 입력하면 추이가 그려집니다</text>`;
 $("#chart").innerHTML=`<div class="row" style="justify-content:space-between"><h2>총점 추이</h2><span class="note">점선 = 목표 800 · 900</span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="모의고사 총점 추이">${g}</svg>`;
 $("#scoreTbl").innerHTML=n?`<thead><tr><th>날짜</th><th style="text-align:right">LC</th><th style="text-align:right">RC</th><th style="text-align:right">총점</th><th></th></tr></thead><tbody>${sc.map((s,i)=>`<tr><td class="mono">${s.d}</td><td class="n">${s.lc}</td><td class="n">${s.rc}</td><td class="n"><b>${s.lc+s.rc}</b></td><td style="text-align:right"><button class="btn small ghost" data-del="${i}" aria-label="삭제">삭제</button></td></tr>`).join("")}</tbody>`:`<tbody><tr><td class="empty">아직 기록이 없습니다. 1단계 첫 주에 기출 1회를 풀어 현재 점수부터 기록하세요.</td></tr></tbody>`;
}

(function boot(){
 const raw=readLocal(KEY2);
 if(raw)S=normalize(raw);else{const m=migrateV1();S=m?normalize(m):blankState()}
 selfCheck();
 if(!S.plan||S.plan.d!==TODAY)refreshPlan();
 saveLocal();
 $("#todayLbl").textContent=TODAY.replace(/-/g,".")+" "+"일월화수목금토"[today.getDay()];
 renderAll();
 let t=null;try{t=sessionStorage.getItem("tab2")}catch(e){}
 show(t==="run"&&!S.cur?"home":(t||"home"));
 connectDb();
})();
})();
</script>
