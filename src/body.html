<header class="top"><div class="inner">
  <div class="brand"><h1>TOEIC <span>900</span> 데일리</h1><small id="todayLbl" class="mono"></small></div>
  <nav role="tablist">
    <button role="tab" data-v="home" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>오늘</span></button>
    <button role="tab" data-v="notes" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></svg><span>노트</span></button>
    <button role="tab" data-v="voca" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="14" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v12"/></svg><span>단어</span></button>
    <button role="tab" data-v="stats" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg><span>분석</span></button>
    <button role="tab" data-v="mock" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l3 2M10 3h4"/></svg><span>실전</span></button>
    <button role="tab" data-v="set" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg><span>설정</span></button>
  </nav>
</div></header>

<main class="wrap">
<section class="view" id="v-home"></section>
<section class="view" id="v-run" hidden></section>
<section class="view" id="v-notes" hidden></section>
<section class="view" id="v-voca" hidden></section>
<section class="view" id="v-stats" hidden></section>

<section class="view" id="v-mock" hidden>
  <div id="stratArea"></div>
  <div id="mockArea" style="display:grid;gap:16px"></div>
  <div class="card">
    <h2>기출 모의고사 점수 기록</h2>
    <form id="scoreForm" class="row">
      <input type="date" id="sDate" required>
      <input type="number" id="sLC" placeholder="LC" min="5" max="495" step="5" required style="width:84px">
      <input type="number" id="sRC" placeholder="RC" min="5" max="495" step="5" required style="width:84px">
      <button class="btn" type="submit">기록</button>
    </form>
    <p class="note" style="margin:0">기출문제집 환산표로 바꾼 점수를 입력.</p>
  </div>
  <div class="card chart"><div id="chart"></div></div>
  <div class="card"><div class="tbl"><table id="scoreTbl"></table></div></div>
</section>

<section class="view" id="v-set" hidden></section>
<p class="foot" id="syncFoot"></p>
</main>
